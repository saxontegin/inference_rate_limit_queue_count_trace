[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saxontegin-inference_rate_limit_queue_count_trace"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出推理成本优化顾问·推理服务的限流与排队上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "saxontegin" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://saxontegin.github.io"
Repository = "https://github.com/saxontegin/inference_rate_limit_queue_count_trace"
Issues = "https://github.com/saxontegin/inference_rate_limit_queue_count_trace/issues"

[project.scripts]
inference_rate_limit_queue_count_trace = "inference_rate_limit_queue_count_trace:main"

[tool.setuptools]
py-modules = ["inference_rate_limit_queue_count_trace"]
